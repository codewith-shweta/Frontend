<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Box</title>
</head>
<body>
    <h1> Alert Box </h1>
    <p> Click button to see an alert </p>
    <button onclick="showalert()"> Click Me  </button>

    <script>
        function showalert() {
            alert("Helloo, You clicked the button.");
        }
       
        </script>
</body>
</html>
