<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1.0, initial-scale=1.0">
    <title>FOR LOOP </title>
</head>
<body>
    <script>
        let a =[3,4,5];
        for(let i=0; i < a; i++);
        {
    
            console.log(a);
        }
        for (let value in [a]);
    {
        console.log(value[a])
    }
   
        </script>
    
</body>
</html>
